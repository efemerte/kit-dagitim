<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onay Paneli</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      gap: 16px;
    }
    .isim { font-size: 4vw; color: #888; font-weight: 500; }
    .secili-no {
      font-size: 14vw;
      font-weight: 900;
      letter-spacing: -2px;
      color: #666;
      transition: all 0.2s ease;
    }
    .secili-no.onaylandi { color: #4a7cf7; }
    .onayla-btn {
      padding: 16px 48px;
      background: #4a7cf7;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 5vw;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-top: 8px;
    }
    .onayla-btn:active { transform: scale(0.95); background: #3a6ae0; }
    .onayla-btn:disabled { background: #333; color: #666; cursor: default; }
    .durum { font-size: 3vw; color: #555; min-height: 1.5em; }
  </style>
</head>
<body>
  <div class="isim" id="isim">Satır seçin</div>
  <div class="secili-no" id="no">—</div>
  <button class="onayla-btn" id="btn" disabled>ONAYLA</button>
  <div class="durum" id="durum"></div>

<script>
  const MAX_GECMIS = 5;
  let mevcutNo = null;
  const noEl    = document.getElementById('no');
  const isimEl  = document.getElementById('isim');
  const btn     = document.getElementById('btn');
  const durumEl = document.getElementById('durum');

  function guncelle(record) {
    if (!record) return;
    const no    = record.Gogus_No || '';
    const ad    = record.Ad    || '';
    const soyad = record.Soyad || '';
    mevcutNo = no || null;
    noEl.textContent   = no || '—';
    isimEl.textContent = (ad + ' ' + soyad).trim() || 'Satır seçin';
    noEl.classList.remove('onaylandi');
    btn.disabled        = !mevcutNo;
    durumEl.textContent = '';
  }

  btn.addEventListener('click', async function() {
    if (!mevcutNo) return;
    btn.disabled = true;
    durumEl.textContent = 'Yazılıyor...';

    try {
      // Durum tablosundaki mevcut kayıtları oku
      const tablo = await grist.docApi.fetchTable('Durum');
      const rowIds = tablo.id; // mevcut satır ID'leri
      const aktifler = tablo.Aktif_No; // mevcut değerler

      // En eski satırı sil, en üste yeni ekle
      // Sıralama: en yeni en başta olacak şekilde shift yapıyoruz
      const actions = [];

      if (rowIds.length >= MAX_GECMIS) {
        // En eski satırı sil
        const enKucukId = Math.min(...rowIds);
actions.push(['RemoveRecord', 'Durum', enKucukId]);
      }

      // En başa yeni satır ekle
      actions.push(['AddRecord', 'Durum', null, { Aktif_No: mevcutNo, Zaman: Date.now() / 1000 }]);

      await grist.docApi.applyUserActions(actions);

      noEl.classList.add('onaylandi');
      durumEl.textContent = '✓ Gönderildi';
      setTimeout(function() {
        durumEl.textContent = '';
        noEl.classList.remove('onaylandi');
        btn.disabled = false;
      }, 1500);

    } catch(e) {
      durumEl.textContent = 'Hata: ' + e.message;
      btn.disabled = false;
    }
  });

  grist.ready({ requiredAccess: 'full' });

  grist.onRecord(function(record) { guncelle(record); });
  grist.on('record', function(record) { guncelle(record); });
</script>
</body>
</html>
