<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Göğüs No Widget</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      gap: 12px;
    }

    .numara-item {
      font-weight: 900;
      line-height: 1;
      letter-spacing: -2px;
      transition: all 0.2s ease;
    }

    .numara-item:nth-child(1) {
      font-size: 18vw;
      color: #fff;
    }

    .numara-item:nth-child(2) {
      font-size: 10vw;
      color: #444;
    }

    .numara-item:nth-child(3) {
      font-size: 8vw;
      color: #333;
    }

    .numara-item:nth-child(4) {
      font-size: 6vw;
      color: #2a2a2a;
    }

    .numara-item:nth-child(5) {
      font-size: 5vw;
      color: #222;
    }

    .flash {
      color: #4a7cf7 !important;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

<script>
  const MAX = 5;
  let gecmis = [];

  function renderListe() {
    document.body.innerHTML = '';
    gecmis.forEach((no, i) => {
      const div = document.createElement('div');
      div.className = 'numara-item' + (i === 0 ? ' flash' : '');
      div.textContent = no;
      document.body.appendChild(div);
      if (i === 0) setTimeout(() => div.classList.remove('flash'), 400);
    });
  }

  function ekle(deger) {
    if (gecmis[0] === deger) return;
    gecmis.unshift(deger);
    if (gecmis.length > MAX) gecmis.pop();
    renderListe();
  }

  grist.ready({
    requiredAccess: 'full',
    columns: [{ name: 'Gogus_No', title: 'Göğüs No', optional: true }]
  });

  grist.onRecord(function(record, mappings) {
    if (!record) return;
    const mapped = grist.mapColumnNames(record, mappings);
    const deger  = (mapped && mapped.Gogus_No) || record.Gogus_No || record['Göğüs No'];
    if (!deger) return;
    ekle(deger);
    grist.docApi.applyUserActions([
      ['UpdateRecord', 'Durum', 1, { Aktif_No: deger }]
    ]).catch(e => console.log('yazma hatası:', e));
  });
</script>
</body>
</html>
