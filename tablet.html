<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablet</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      gap: 12px;
    }
    .numara-item {
      font-weight: 900;
      line-height: 1;
      letter-spacing: -2px;
      transition: all 0.2s ease;
    }
    .numara-item:nth-child(1) { font-size: 18vw; color: #fff; }
    .numara-item:nth-child(2) { font-size: 10vw; color: #444; }
    .numara-item:nth-child(3) { font-size: 8vw;  color: #333; }
    .numara-item:nth-child(4) { font-size: 6vw;  color: #2a2a2a; }
    .numara-item:nth-child(5) { font-size: 5vw;  color: #222; }
    .flash { color: #4a7cf7 !important; transform: scale(1.05); }
  </style>
</head>
<body>
<script>
  const KOL = 'Aktif_No';
  let sonIlk = null;

  function render(liste) {
    document.body.innerHTML = '';
    const ilk = liste[0];
    liste.forEach((no, i) => {
      const div = document.createElement('div');
      const yeniFlash = (i === 0 && ilk !== sonIlk);
      div.className = 'numara-item' + (yeniFlash ? ' flash' : '');
      div.textContent = no;
      document.body.appendChild(div);
      if (yeniFlash) setTimeout(() => div.classList.remove('flash'), 400);
    });
    sonIlk = ilk;
  }

  async function oku() {
    try {
      const tablo = await grist.docApi.fetchTable('Durum');
      const ids   = tablo.id;
      const degerler = tablo[KOL];

      // ID'ye göre azalan sırala (en yüksek ID = en yeni)
      const satirlar = ids.map((id, i) => ({ id, deger: degerler[i] }))
        .filter(s => s.deger)
        .sort((a, b) => b.id - a.id)
        .map(s => s.deger);

      if (satirlar.length > 0) render(satirlar);
    } catch(e) {}
  }

  grist.ready({ requiredAccess: 'full' });

  // Hazır olunca polling başlat
  setTimeout(function() {
    oku();
    setInterval(oku, 1500);
  }, 500);
</script>
</body>
</html>
